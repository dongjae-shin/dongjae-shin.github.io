name: Update visitor stats

on:
  schedule:
    - cron: "31 10 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update-visitor-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Google Analytics client
        run: python3 -m pip install google-analytics-data google-auth

      - name: Update visitor stats
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_START_DATE: ${{ vars.GA_START_DATE }}
        run: python3 _scripts/update_visitor_stats.py

      - name: Update GitHub repository stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 _scripts/update_github_repos.py

      - name: Commit stat changes
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          commit_message: Update visitor and GitHub repository stats
          file_pattern: _data/visitor_stats.json _data/repositories.yml

      - name: Dispatch deploy workflow
        if: steps.auto-commit-action.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
